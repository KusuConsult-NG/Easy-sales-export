name: Continuous Integration

# The repo default is already read-only, but an org-level change would
# silently widen every workflow. Declared here so it cannot.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Runs before anything else, and on its own, because a leaked credential is not
  # a build failure — it is an incident, and the sooner it is visible the smaller
  # it is.
  #
  # A live Paystack secret key sat in scripts/force-sync.js from 2026-04-16 to
  # 2026-07-15 in a PUBLIC repository. Deleting the file did not remove it from
  # history. Nothing in CI looked, so nothing said anything for four months.
  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks-action lists a pull request's commits to scope its scan, which
    # needs pull-requests: read. The workflow-level `contents: read` added on
    # 2026-08-11 dropped the default token's broader grant, so this job started
    # failing on every PR with a 403 from /pulls/{n}/commits — while still
    # passing on pushes to main, where no PR API call happens.
    #
    # That is my own least-privilege change breaking the job it sat next to.
    # The fix is to grant what this job actually needs rather than widen the
    # workflow again.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # fetch-depth: 0 is the point. A shallow clone only sees the tip, and the
      # leak that prompted this was in history with a clean working tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the full history for credentials
        # Pinned to a commit, not the mutable v2 tag. A third-party action runs
        # in CI with repository access; whoever controls the tag controls that
        # code. This repo's history holds a live-key incident and 41,105 user
        # records, so the blast radius is not theoretical.
        # gitleaks/gitleaks-action v2 as of 2025-04-17.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match .node-version, the Dockerfile (node:22-alpine) and the
      # ">=22.12.0" engines constraint in package.json. CI was pinned to Node 20,
      # so it validated the app on a runtime production never uses.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compile Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # CI previously stopped at tsc + jest. Neither catches a broken production
      # build, which is what actually ships, so build regressions reached
      # production unchallenged.
      - name: Production Build
        run: npm run build
        env:
          # The Dockerfile that builds production sets this and CI did not, so
          # CI ran the same build with the default V8 heap and died with
          # "Aborted (core dumped)", exit 134 — an out-of-memory, not a code
          # failure. Every run since 2026-08-11T14:25Z failed this way.
          #
          # A CI build that cannot complete is worse than no CI build: it fails
          # for a reason unrelated to the change, so the signal is discarded and
          # a real regression would land unnoticed behind it.
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXTAUTH_SECRET: placeholder-ci-secret-placeholder-ci-secret
          AUTH_SECRET: placeholder-ci-secret-placeholder-ci-secret

      - name: Run Jest Unit Tests
        run: npm run test
