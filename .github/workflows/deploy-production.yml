name: Deploy — Production (Manual Gate)

# The repo default is already read-only, but an org-level change would
# silently widen every workflow. Declared here so it cannot.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.3.2)'
        required: true
        type: string
      certification_word:
        description: 'Type CERTIFIED to confirm release checklist is complete'
        required: true
        type: string
      # #700 — this was `type: string` requiring the literal "YES", and THIS
      # PROJECT HAS NO STAGING ENVIRONMENT. The only mentions of staging in the
      # repository are this input and a CI comment recording that .env.staging
      # carries EMPTY Supabase values. So the gate could be passed only by
      # asserting something untrue, on every release, forever.
      #
      # A gate that can only be passed by a false statement is not a gate — it
      # teaches whoever runs it to type the magic word without reading, which is
      # exactly what it exists to prevent. #691 found the same shape in the push
      # hook: a URL is a declaration, not a service.
      #
      # A choice, so the honest answer is available and is recorded in the run.
      # If a staging environment is ever built, YES becomes meaningful again and
      # nothing here has to change back.
      staging_validated:
        description: 'Was this validated on staging?'
        required: true
        type: choice
        options:
          - 'NO_STAGING_ENVIRONMENT'
          - 'YES'
        default: 'NO_STAGING_ENVIRONMENT'
      paystack_reconciled:
        description: 'Confirm Paystack reconciliation passed (type YES)'
        required: true
        type: string

jobs:
  # Gate: all confirmations must be correct
  gate:
    name: Release Gate — Validate Certification
    runs-on: ubuntu-latest

    steps:
      - name: Verify certification inputs
        run: |
          if [ "${{ github.event.inputs.certification_word }}" != "CERTIFIED" ]; then
            echo "❌ GATE FAILED: certification_word must be exactly 'CERTIFIED'"
            exit 1
          fi
          # #700 — both answers pass, and the run records WHICH. The gate's job
          # is that a person states the position deliberately, not that they
          # produce a fixed string; see the note on the input.
          case "${{ github.event.inputs.staging_validated }}" in
            YES)
              echo "✅ staging: validated" ;;
            NO_STAGING_ENVIRONMENT)
              echo "⚠️  staging: none exists — deploying straight from main." ;;
            *)
              echo "❌ GATE FAILED: staging_validated must be YES or NO_STAGING_ENVIRONMENT"
              exit 1 ;;
          esac
          if [ "${{ github.event.inputs.paystack_reconciled }}" != "YES" ]; then
            echo "❌ GATE FAILED: paystack_reconciled must be 'YES'"
            exit 1
          fi
          echo "✅ All certification gates passed"

  # Final validation run before production deploy
  final-validate:
    name: Final Validation
    needs: gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --passWithNoTests --ci

  # Tag the release in git
  tag-release:
    name: Tag Release
    needs: final-validate
    runs-on: ubuntu-latest

    # The default GITHUB_TOKEN is read-only, so `git push origin <tag>` came
    # back 403 "Permission to ... denied to github-actions[bot]" and the deploy
    # job was skipped. Tagging is the only step here that writes to the repo.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push git tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ github.event.inputs.release_version }}" \
            -m "Release ${{ github.event.inputs.release_version }} — certified production deployment"
          git push origin "${{ github.event.inputs.release_version }}"

  # #703 — CONFIRM the release reached production. It does not trigger one:
  # Railway's GitHub integration deploys `main` on push, and the mutation this
  # job used to call does not exist. The name said "Deploy" for a year while the
  # job deployed nothing, which is the kind of thing this audit exists to stop.
  deploy-production:
    name: Confirm Production Release
    needs: tag-release
    runs-on: ubuntu-latest

    steps:
      # #703 — THIS STEP CALLED A MUTATION RAILWAY DOES NOT HAVE.
      #
      # It POSTed `mutation { deploymentTrigger(input: { serviceId: ... }) }`
      # and Railway answered HTTP 400:
      #
      #   Cannot query field "deploymentTrigger" on type "Mutation".
      #   Did you mean "deploymentCancel", "deploymentRemove",
      #   "deploymentRestart", "deploymentTriggerCreate", ...
      #
      # There is no such field, so this workflow has NEVER deployed anything.
      # That is also what happened on 2026-08-09 for v1.2.0, recorded above:
      # the step was a bare `curl` whose exit status was the only check, so a
      # GraphQL error returned with HTTP 200 read as success. Hardening the step
      # is what finally made the real failure visible.
      #
      # AND NOTHING WAS LOST BY IT, which is why this is a verification and not
      # a corrected mutation. Railway's own GitHub integration deploys `main` on
      # push; that is how every release has actually reached production,
      # including every one this workflow reported. Re-triggering it from here
      # would be a second way to do something that already happens.
      #
      # SO THE STEP NOW ASSERTS THE THING THE OLD ONE ADMITTED IT COULD NOT:
      # the comment above said "WHAT IT STILL DOES NOT ASSERT: that the build
      # succeeded and the new revision is serving traffic". This waits until
      # production reports the commit being released, and fails if it never
      # does. A release is not a request that was accepted; it is a revision
      # that is answering.
      - name: Verify production is serving this commit
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -o pipefail

          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::PRODUCTION_URL is empty, so there is nothing to check. Set the secret to the host the application is served on, including www if that is canonical."
            exit 1
          fi

          # Railway builds an image before it swaps containers; measured at
          # roughly ten minutes on this project. Twenty is generous without
          # being a workflow that hangs.
          DEADLINE=$(( $(date +%s) + 1200 ))
          attempt=0
          last=""

          echo "Waiting for $PRODUCTION_URL to report ${RELEASE_SHA:0:7}"

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            attempt=$(( attempt + 1 ))

            # -f is deliberately NOT used: a non-2xx body is worth printing.
            body=$(curl -sS --max-time 20 "$PRODUCTION_URL/api/health" 2>/dev/null || true)
            serving=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)

            if [ -n "$serving" ]; then
              last="$serving"
              if [ "$serving" = "$RELEASE_SHA" ]; then
                echo "Production is serving ${serving:0:7}."
                echo "SERVING_COMMIT=$serving" >> "$GITHUB_ENV"
                exit 0
              fi
            fi

            # Reported every fifth attempt so a long wait is legible without
            # being a wall of text.
            if [ $(( attempt % 5 )) -eq 1 ]; then
              echo "  attempt $attempt: serving ${last:-<no commit reported>}"
            fi
            sleep 20
          done

          # THREE DISTINCT FAILURES, NAMED SEPARATELY. "It did not deploy" sends
          # somebody to the wrong place in two of these three cases.
          if [ -z "$last" ]; then
            echo "::error::$PRODUCTION_URL/api/health NEVER REPORTED A COMMIT. Either the host is not answering, or the running build predates the deployment facts on /api/health (#470). This is not evidence that the release failed — it is evidence that this check cannot see it."
          elif [ "$last" = "$RELEASE_SHA" ]; then
            echo "::error::Internal: the loop exited without matching a commit it had already matched."
          else
            echo "::error::PRODUCTION IS STILL SERVING ${last:0:7}, NOT ${RELEASE_SHA:0:7}. The release did not reach production within twenty minutes. Check Railway: the build may have failed, or auto-deploy from main may be disabled for this service."
          fi
          exit 1

      - name: Log deployment event
        run: |
          echo "=== PRODUCTION RELEASE CONFIRMED ==="
          echo "Version:  ${{ github.event.inputs.release_version }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Serving:  $SERVING_COMMIT"
          echo "Released by: ${{ github.actor }}"
          echo "Timestamp:   $(date -u)"
          echo ""
          echo "This line means production ANSWERED with this commit, not that a"
          echo "request to deploy was accepted. That distinction is #703."
          echo "===================================="
