name: Scheduled Jobs

# WHY THIS EXISTS
# ---------------
# src/app/api/cron/ contains four endpoints that are written to run on a
# schedule and were never scheduled by anything. There is no `cron` block in
# railway.json, no vercel.json, and no other workflow that calls them. They have
# existed as HTTP endpoints that nothing invokes.
#
# The consequences were not theoretical:
#
#   reconcile-paystack   The safety net for payments the webhook missed. Eight
#                        cooperative registrations paid between 2026-07-21 and
#                        2026-08-08 were never fulfilled and had to be repaired
#                        by hand. This job is what would have caught them.
#
#   release-escrow       Escrow auto-release. Without it a seller is only ever
#                        paid when the buyer explicitly confirms delivery, so
#                        funds sit in escrow indefinitely when they do not.
#
#   process-email-queue  Queued mail is only sent when something else happens to
#                        drain the queue.
#
#   gdpr-purge           Data retention. This one is a legal obligation, not a
#                        convenience.
#
#   reconcile-fulfilment Asks whether each recorded payment produced the thing
#                        it paid for. reconcile-paystack cannot see that — it
#                        compares references, and the eight broken registrations
#                        all HAD their reference. Runs 8 minutes after it, so a
#                        payment reconcile-paystack has just healed is not
#                        reported as unfulfilled by a race between the two.
#
# #614 ADDED TWO THIS FILE HAD ALREADY DRIFTED PAST. Seven endpoints exist under
# src/app/api/cron/ and this workflow named five, so the list of jobs was kept by
# hand in four places — the route directories, the schedule block, the manual
# dispatch options and the case statement below — and two of them fell out:
#
#   close-export-windows Closes an export window whose investment period has
#                        ended (#196). Nothing else writes "closed", so without
#                        it every expired window stays listed. The money half is
#                        already safe — all three investment doors refuse an
#                        expired window — so the cost is a list offering
#                        opportunities that cannot be taken.
#
#   release-stale-reservations
#                        Gives back a parcel a buyer walked away from (#140).
#                        This is the severe one: a hold has no other exit. The
#                        owner cannot relist, no other buyer can claim, and an
#                        admin cannot free it either — #137 deliberately removed
#                        "pending" from the statuses an approval may overwrite.
#                        Closing the checkout tab took the parcel off the market
#                        FOR GOOD. Hourly, against holds of two hours and seven
#                        days, so a lapse is released well within either.
#
# a-job-nobody-scheduled.test.ts now holds all four lists to each other, so a
# third omission fails the suite rather than waiting to be noticed.
#
#   age-notifications    #615. Nothing aged a notification out, so one screen
#                        showed two months of them in a column (#534). Marks rows
#                        past their window as archived — thirty days once read,
#                        six months if never read. NOTHING IS DELETED; the flag is
#                        reversible. Daily, after gdpr-purge.
#
#                        This one is the ratchet above working: the endpoint was
#                        written, the suite went red for all three lists, and it
#                        could not be forgotten the way the previous two were.
#
# GitHub's scheduler is best-effort and can be delayed under load, which is
# acceptable for all four: every one of them is idempotent and catch-up by
# design, so a late or skipped run costs latency rather than correctness.
#
# REQUIRED SECRETS — the jobs do nothing until both are set:
#   CRON_SECRET     must equal the CRON_SECRET the running app checks
#   PRODUCTION_URL  base URL, no trailing slash, e.g. https://app.example.com
#
# #623 THE SCHEDULE IS ON. It was commented out "to prevent failing runs when
# secrets are unset", which is a real cost — but it meant eight jobs this file
# exists to run were not running, which is the exact defect the file was written
# to fix, left in place by the fix for it. Silence is the worse of the two.
#
# The noise is bounded instead of the schedule being disabled:
#
#   a SCHEDULED run with no secrets   annotates a warning and stops. It does not
#                                     call anything and does not fail.
#   the DAILY config check            fails loudly, once a day, naming what is
#                                     missing. Bounded, so it cannot be muted
#                                     the way 96 failures a day would be.
#   a MANUAL run with no secrets      fails hard. A person asked for this one
#                                     and is owed a real answer.
#
# So the moment both secrets exist, all eight jobs begin running with no further
# edit to this file — and until then it says so once a day rather than silently
# doing nothing, which is how this situation arose.

# The repo default is already read-only, but an org-level change would
# silently widen every workflow. Declared here so it cannot.
permissions:
  contents: read

# Automatic schedule ENABLED — #623. See the note above for how a run behaves
# while CRON_SECRET and PRODUCTION_URL are still unset.
on:
  schedule:
    - cron: '*/15 * * * *'   # process-email-queue  — every 15 minutes
    - cron: '17 * * * *'     # release-escrow       — hourly, off the hour
    - cron: '43 */6 * * *'   # reconcile-paystack   — every 6 hours
    - cron: '51 */6 * * *'   # reconcile-fulfilment — every 6 hours, after it
    - cron: '0 3 * * *'      # gdpr-purge           — daily at 03:00 UTC
    - cron: '7 * * * *'      # close-export-windows — hourly, off the hour
    - cron: '23 * * * *'     # release-stale-reservations — hourly
    - cron: '13 4 * * *'     # age-notifications    — daily, after gdpr-purge
    # #702 — daily, well clear of the other jobs. The repair is idempotent and
    # fills only blank rows, so a run that finds nothing is the steady state.
    - cron: '37 5 * * *'     # backfill-missing-emails — daily
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run now'
        required: true
        type: choice
        options:
          - process-email-queue
          - release-escrow
          - reconcile-paystack
          - reconcile-fulfilment
          - gdpr-purge
          - close-export-windows
          - release-stale-reservations
          - age-notifications
          - backfill-missing-emails

# The offsets (:17, :43) keep these off the top of the hour, when GitHub's
# scheduler is most contended and delays are longest.

jobs:
  # Once a day, and only once, say out loud that this is not configured. A
  # failure every fifteen minutes is a failure nobody reads; one a day is a
  # failure somebody fixes. Rides the existing gdpr-purge schedule rather than
  # adding a ninth cron line, which would put a name in the schedule block that
  # is not an endpoint and break the four-list ratchet in
  # a-job-nobody-scheduled.test.ts.
  config-check:
    name: Daily check that the schedule can actually work
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Fail loudly if the secrets are missing
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          missing=0
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Every scheduled job will 401."
            missing=1
          fi
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::PRODUCTION_URL is not set. There is nothing to call."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Eight scheduled jobs are not running. Set both secrets in repository settings."
            exit 1
          fi
          echo "Secrets present. The schedule is live."

  preflight:
    name: Check required secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Decide whether this run can do anything
        id: check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          missing=""
          [ -z "$CRON_SECRET" ]    && missing="$missing CRON_SECRET"
          [ -z "$PRODUCTION_URL" ] && missing="$missing PRODUCTION_URL"

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Secrets present."
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          # A person pressed the button and is waiting for an answer. Give them
          # a real one rather than a green tick over a job that never ran.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::Not configured — missing:$missing. Nothing was called."
            exit 1
          fi

          # A scheduled run. Annotated and skipped, not failed: the daily
          # config-check above is what makes this impossible to miss, and it
          # fails once a day instead of ninety-six times.
          echo "::warning::Not configured — missing:$missing. Skipping this run."

  run-job:
    name: Invoke cron endpoint
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve which endpoint this run is for
        id: which
        run: |
          case "${{ github.event.schedule }}" in
            '*/15 * * * *') echo "path=process-email-queue" >> "$GITHUB_OUTPUT" ;;
            '17 * * * *')   echo "path=release-escrow"      >> "$GITHUB_OUTPUT" ;;
            '43 */6 * * *') echo "path=reconcile-paystack"  >> "$GITHUB_OUTPUT" ;;
            '51 */6 * * *') echo "path=reconcile-fulfilment" >> "$GITHUB_OUTPUT" ;;
            '0 3 * * *')    echo "path=gdpr-purge"          >> "$GITHUB_OUTPUT" ;;
            '7 * * * *')    echo "path=close-export-windows" >> "$GITHUB_OUTPUT" ;;
            '23 * * * *')   echo "path=release-stale-reservations" >> "$GITHUB_OUTPUT" ;;
            '13 4 * * *')   echo "path=age-notifications"    >> "$GITHUB_OUTPUT" ;;
            '37 5 * * *')   echo "path=backfill-missing-emails" >> "$GITHUB_OUTPUT" ;;
            *)              echo "path=${{ inputs.job }}"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Call it
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          JOB_PATH: ${{ steps.which.outputs.path }}
        run: |
          if [ -z "$JOB_PATH" ]; then
            echo "::error::Could not resolve a job for this trigger."
            exit 1
          fi

          echo "Invoking /api/cron/$JOB_PATH"

          # -sS so curl is quiet but still reports errors; --max-time because a
          # hung request must not hold a runner for six hours.
          # %{redirect_url} is empty unless the answer was a 3xx — see the
          # redirect check below, which is why both are captured.
          read -r http_code redirect_url <<< "$(curl -sS -o /tmp/body.json \
            -w '%{http_code} %{redirect_url}' \
            --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/cron/$JOB_PATH")"

          echo "HTTP $http_code"
          # The body is the job's own report. Print it — a scheduled job whose
          # output nobody can see is barely better than one that never runs.
          head -c 4000 /tmp/body.json || true
          echo

          # ── #632 A REDIRECT IS NOT A SUCCESS ──────────────────────────
          #
          # This check used to be `if [ "$http_code" -ge 400 ]`, and a 3xx is
          # not greater than 400. So a redirect made the step PASS while the
          # endpoint was never invoked: eight scheduled jobs reporting green,
          # for ever, having done nothing.
          #
          # It is not hypothetical. The middleware answers 308 from the apex to
          # canonicalise the host, so setting PRODUCTION_URL to
          # https://easysalesexport.com rather than https://www.easysalesexport.com
          # — the natural thing to type, and one character shorter — is enough.
          # The alarm that exists to say the jobs are not running would have said
          # they were.
          #
          # NOT FOLLOWED WITH -L, deliberately. curl drops the Authorization
          # header across a host change, so following would turn a silent no-op
          # into a 401 and blame the secret; and following quietly would hide a
          # misconfiguration that somebody should fix once rather than tolerate
          # on every run.
          if [ "$http_code" -ge 300 ] && [ "$http_code" -lt 400 ]; then
            echo "::error::PRODUCTION_URL REDIRECTS, SO THE JOB DID NOT RUN. /api/cron/$JOB_PATH answered $http_code pointing at ${redirect_url:-an unnamed location}. Set the PRODUCTION_URL secret to the host the application is actually served on, including the www prefix if that is the canonical one — a redirect is not a run."
            exit 1
          fi

          # ── #631 SAY WHICH KIND OF FAILURE THIS IS ────────────────────
          #
          # These jobs failed 779 times and then the schedule was switched off.
          # The message every one of them printed was
          #
          #     /api/cron/process-email-queue returned HTTP 404
          #
          # which reads as "that route is missing" — a code problem. It was not.
          # The body said so and nobody was looking at it:
          #
          #     {"status":"error","code":404,"message":"Application not found",
          #      "request_id":"f848Mjx0QTKK88Wun6XIxQ"}
          #
          # That is the HOST's error page, not this application's: there was no
          # app deployed at PRODUCTION_URL at all. A configuration problem
          # wearing the costume of a routing one, for three weeks, ending in the
          # schedule being commented out — which silenced the alarm rather than
          # answering it.
          #
          # A 404 from the edge and a 404 from the app need different people to
          # do different things, so they are no longer told apart by reading the
          # body by hand.
          if [ "$http_code" -ge 400 ]; then
            if grep -qi 'Application not found\|no application\|not_found_error' /tmp/body.json 2>/dev/null; then
              echo "::error::NOTHING IS DEPLOYED AT PRODUCTION_URL. The host answered, and said it has no application at that address — so every scheduled job is failing for one reason and it is not this route. Check the PRODUCTION_URL repository secret against the URL your app is actually served on."
            elif [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
              echo "::error::THE APP REFUSED THE CRON SECRET. /api/cron/$JOB_PATH answered $http_code, which is what it returns when the Authorization header does not match its own CRON_SECRET. The secret is SET — it does not match the one the running app checks."
            elif [ "$http_code" = "404" ]; then
              echo "::error::THE APP IS THERE AND THE ROUTE IS NOT. /api/cron/$JOB_PATH returned 404 from the application itself, so this endpoint is missing from the deployed build — most likely the deployed build is older than the route."
            elif [ "$http_code" = "409" ]; then
              # ── #677 THE JOB RAN AND THE DATA IS WRONG ────────────────────
              #
              # A third kind of failure, and the one this workflow could not
              # previously express. Every branch above says the job DID NOT RUN;
              # this one says it ran perfectly and found something.
              #
              # reconcile-paystack returned 200 for `critical` — more than three
              # payments present in Paystack and missing from the database — so
              # a run that found money the platform has no record of printed a
              # green tick. The result went to system_health, which nothing in
              # the application reads.
              echo "::error::THE JOB RAN AND FOUND A PROBLEM WITH THE DATA. /api/cron/$JOB_PATH completed normally and is reporting a discrepancy it wants a human to look at — this is NOT a broken endpoint or a bad secret. The response body above lists what it found; for reconcile-paystack that is payments Paystack has and this platform does not."
            else
              echo "::error::/api/cron/$JOB_PATH returned HTTP $http_code"
            fi
            exit 1
          fi
